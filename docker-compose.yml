services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-teamfinder}
      POSTGRES_USER: ${POSTGRES_USER:-teamfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-teamfinder}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-teamfinder}
      REDIS_URL: redis://redis:6379/0
      BOT_TOKEN: ${BOT_TOKEN:?BOT_TOKEN is required}
      FACEIT_API_KEY: ${FACEIT_API_KEY:?FACEIT_API_KEY is required}
      FACEIT_CLIENT_ID: ${FACEIT_CLIENT_ID:?FACEIT_CLIENT_ID is required}
      FACEIT_CLIENT_SECRET: ${FACEIT_CLIENT_SECRET:?FACEIT_CLIENT_SECRET is required}
      FACEIT_REDIRECT_URI: ${FACEIT_REDIRECT_URI:?FACEIT_REDIRECT_URI is required}
      FACEIT_PROXY_URL: ${FACEIT_PROXY_URL:-}
      FACEIT_PROXY_SECRET: ${FACEIT_PROXY_SECRET:-}
      FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:?TELEGRAM_BOT_USERNAME is required}
      TELEGRAM_MINI_APP_SHORT_NAME: ${TELEGRAM_MINI_APP_SHORT_NAME:-}
      AUTH_MAX_AGE_SECONDS: ${AUTH_MAX_AGE_SECONDS:-3600}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    expose: ["8000"]
  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports: ["127.0.0.1:8080:80"]
volumes:
  postgres_data:
  redis_data:
