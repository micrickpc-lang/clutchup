server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  client_max_body_size 64k;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https: data:; connect-src 'self' https://*.telegram.org; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors https://web.telegram.org https://*.telegram.org" always;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 15s;
    proxy_read_timeout 20s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
  }
  location = /health {
    proxy_pass http://backend:8000/health;
    proxy_connect_timeout 3s;
    proxy_read_timeout 5s;
  }
  location ~* ^/assets/.*\.[a-z0-9]+$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
  location = /index.html { add_header Cache-Control "no-store"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-store"; }
}
